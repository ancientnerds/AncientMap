# ANCIENT NERDS - Research Platform - Docker Compose Configuration
# PostgreSQL + PostGIS for geospatial data storage

services:
  # ==========================================================================
  # PostgreSQL Database with PostGIS Extension
  # ==========================================================================
  db:
    image: postgis/postgis:16-3.4
    container_name: ancient_nerds_db
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ancient_map}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ancient_map}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_extensions.sql:/docker-entrypoint-initdb.d/init_extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ancient_map} -d ${POSTGRES_DB:-ancient_map}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Redis for API rate limiting and caching (optional, for later)
  # NOTE: Pinned to 7.2.4 for BSD-3-Clause license. Redis 7.4+ uses RSALv2/SSPLv1.
  # ==========================================================================
  redis:
    image: redis:7.2.4-alpine
    container_name: ancient_nerds_redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Qdrant Vector Database for AI Search
  # ==========================================================================
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: ancient_nerds_qdrant
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # API Service (FastAPI + Uvicorn)
  # ==========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_HASH: ${BUILD_HASH:-unknown}
    container_name: ancient_nerds_api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      QDRANT_HOST: qdrant
      PATREON_WEBHOOK_SECRET: ${PATREON_WEBHOOK_SECRET:-}
      TRUSTED_PROXY: "1"
    volumes:
      - ./public/data:/app/public/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

  # ==========================================================================
  # Lyra News Pipeline (YouTube monitoring + AI summarization)
  # ==========================================================================
  lyra:
    build:
      context: .
      dockerfile: Dockerfile.lyra
    container_name: ancient_nerds_lyra
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
    volumes:
      - ./public/data/news:/app/public/data/news
    depends_on:
      db:
        condition: service_healthy

  # ==========================================================================
  # Webcam Stream Proxy (HLS stream extraction + CORS proxy)
  # ==========================================================================
  webcam-proxy:
    build:
      context: .
      dockerfile: Dockerfile.webcam-proxy
    container_name: ancient_nerds_webcam_proxy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:8765:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/api/status')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ==========================================================================
  # Pipeline: Download + Ingest + Export (run on demand)
  # Usage: docker compose run --rm pipeline
  # ==========================================================================
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    container_name: ancient_nerds_pipeline
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
    volumes:
      - ./data/raw:/app/data/raw
      - ./public/data:/app/public/data
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - pipeline

  # ==========================================================================
  # pgAdmin for database management (optional, for development)
  # ==========================================================================
  pgadmin:
    image: dpage/pgadmin4:8.14.0
    container_name: ancient_nerds_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@localhost}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-changeme-not-for-production}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    profiles:
      - dev  # Only start with: docker compose --profile dev up

volumes:
  postgres_data:
    name: ancient_map_postgres_data
  redis_data:
    name: ancient_map_redis_data
  pgadmin_data:
    name: ancient_map_pgadmin_data
  qdrant_data:
    name: ancient_map_qdrant_data

networks:
  default:
    name: ancient_map_network
