# ANCIENT NERDS - Research Platform - Docker Compose Configuration
# PostgreSQL + PostGIS for geospatial data storage

services:
  # ==========================================================================
  # PostgreSQL Database with PostGIS Extension
  # ==========================================================================
  db:
    image: postgis/postgis:16-3.4
    container_name: ancient_nerds_db
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ancient_map}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ancient_map}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_extensions.sql:/docker-entrypoint-initdb.d/init_extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ancient_map} -d ${POSTGRES_DB:-ancient_map}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Redis for API rate limiting and caching (optional, for later)
  # NOTE: Pinned to 7.2.4 for BSD-3-Clause license. Redis 7.4+ uses RSALv2/SSPLv1.
  # ==========================================================================
  redis:
    image: redis:7.2.4-alpine
    container_name: ancient_nerds_redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Qdrant Vector Database for AI Search
  # ==========================================================================
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: ancient_nerds_qdrant
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # API Service (FastAPI + Uvicorn)
  # ==========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_HASH: ${BUILD_HASH:-unknown}
    container_name: ancient_nerds_api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      # api/cache.py connects via REDIS_URL, not REDIS_HOST — without this
      # override the .env localhost URL is unreachable in-container and the
      # cache silently falls back to per-process memory
      REDIS_URL: redis://redis:6379/0
      QDRANT_HOST: qdrant
      TRUSTED_PROXY: "1"
      # The research worker lives in the theo-worker container (see above);
      # without this the API would run a second poll loop and both would
      # race for the same queued rows.
      THEO_WORKER_EXTERNAL: "1"
    volumes:
      - ./public/data:/app/public/data
      - ./logs:/app/logs:ro
      # SEO routes serve the real built app shell (pipeline/app_shell.py).
      # Mount the PARENT of dist/, not dist/ itself: the deploy swaps builds
      # in with `mv dist dist-old && mv dist-new dist`, which replaces the
      # directory inode. A mount on dist/ would stay bound to the deleted
      # inode and serve stale shells — and this container is not rebuilt when
      # only frontend files change.
      - ./ancient-nerds-map:/app/frontend:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

  # ==========================================================================
  # Theo Research Worker — same image as the API, different entrypoint.
  #
  # Split out of the API process on 2026-08-08: a research run takes 7-15h,
  # and every API rebuild used to kill the one in flight (observed twice on
  # 2026-08-07 — a 15h paper and ~9% of the weekly token budget lost each
  # time). The deploy skips rebuilding THIS container while a run is active
  # and picks the new code up on the next deploy after it finishes.
  # ==========================================================================
  theo-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_HASH: ${BUILD_HASH:-unknown}
    container_name: ancient_nerds_theo_worker
    restart: unless-stopped
    command: ["python", "scripts/run_theo_worker.py"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      REDIS_URL: redis://redis:6379/0
      QDRANT_HOST: qdrant
    volumes:
      - ./public/data:/app/public/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  # ==========================================================================
  # Lyra News Pipeline (YouTube monitoring + AI summarization)
  # ==========================================================================
  lyra:
    build:
      context: .
      dockerfile: Dockerfile.lyra
    container_name: ancient_nerds_lyra
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
      # pipeline/connectors/cache.py uses api.cache's Redis client (REDIS_URL)
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./public/data/news:/app/public/data/news
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The orchestrator touches /tmp/lyra_heartbeat at every main-loop wake
      # (60s), at each pipeline-step start, and around article generation
      # (see _touch_heartbeat in pipeline/lyra/orchestrator.py). Threshold
      # 900s: 3x the 60s wake interval would be 180s, but single LLM-heavy
      # steps (summarize/tts/article) legitimately hold the loop for minutes
      # without returning — 15x still catches genuine hangs (wedged DB call,
      # dead process) without flagging long steps. start_period covers
      # startup (create_all_tables + migrations can take minutes).
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/lyra_heartbeat') < 900 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15m

  # ==========================================================================
  # Webcam Stream Proxy (HLS stream extraction + CORS proxy)
  # ==========================================================================
  webcam-proxy:
    build:
      context: .
      dockerfile: Dockerfile.webcam-proxy
    container_name: ancient_nerds_webcam_proxy
    restart: unless-stopped
    environment:
      PATH_PREFIX: /webcam-proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:8765:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/api/status')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ==========================================================================
  # Pipeline: Download + Ingest + Export (run on demand)
  # Usage: docker compose run --rm pipeline
  # ==========================================================================
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    container_name: ancient_nerds_pipeline
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
    volumes:
      - ./data/raw:/app/data/raw
      - ./public/data:/app/public/data
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - pipeline

  # ==========================================================================
  # pgAdmin for database management (optional, for development)
  # ==========================================================================
  pgadmin:
    image: dpage/pgadmin4:8.14.0
    container_name: ancient_nerds_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@localhost}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-changeme-not-for-production}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    profiles:
      - dev  # Only start with: docker compose --profile dev up

volumes:
  postgres_data:
    name: ancient_map_postgres_data
  redis_data:
    name: ancient_map_redis_data
  pgadmin_data:
    name: ancient_map_pgadmin_data
  qdrant_data:
    name: ancient_map_qdrant_data

networks:
  default:
    name: ancient_map_network
