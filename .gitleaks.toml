# gitleaks configuration — secrets scanning for code AND full git history.
# CI runs: gitleaks git --no-banner (see .github/workflows/ci.yml, sast job).
# Historical, individually-triaged findings live in .gitleaksignore.
#
# Triage policy: every allowlist entry needs a reason. Never allowlist a
# finding that is a real credential — rotate it instead.

[extend]
useDefault = true

[allowlist]
description = "Public identifiers that are not credentials"

# Discord snowflake IDs (guild/client/channel IDs) are public identifiers,
# not credentials. The default discord-client-id rule matches any 17-19 digit
# number near the word "discord".
regexes = [
    '''932330696956063765''',  # DISCORD_GUILD_ID default (public guild ID)
    '''968657029658980432''',  # Lyra test channel ID (public)
    '''442000112756064260''',  # THEO_FEEDER_USER_ID default (public Discord user id)
    # IndexNow key (pipeline/indexnow.py, ancient-nerds-map/public/<key>.txt):
    # public by protocol design — ownership is proven by serving the key at
    # https://ancientnerds.com/<key>.txt, so it is not a credential.
    '''fd469cc4e21cf3949e997e570dbc7b6b''',
]

# Lane WB's journalled write steps (output/remediation/mechanical_teaser/sNNN/{prov,card}/*.sql,
# committed with the trail of each sitting, docs/procedures/CARD_DESCRIPTIONS.md 5.5): the statements
# carry each site's premise as sha256 hex (the description's and the card's text hash, "key as it
# was") - hashes of public text, not credentials. First flagged in the push of 5c7d52f (38 findings,
# generic-api-key, all such hashes).
paths = [
    '''output/remediation/mechanical_teaser/s[0-9]{3}/(prov|card)/[A-Z_]+\.sql''',
    # WD2/IH, the import-hero lane's plan files
    # (output/remediation/import_hero/*/chunk-*/PLAN.jsonl, committed with each chunk's statement
    # and undo - docs/procedures/WD2_SERVED_IMAGE_AND_SCOPE.md section 3.7): every
    # `unified_sites.thumbnail_url` record carries `"row_key": "<site uuid>"`, and the default
    # generic-api-key rule reads a JSON key whose name ends in `key` followed by an
    # entropy-looking value as a credential. It is the row's primary key - a site id, public in
    # every page of this site. First flagged in the push of a5c51af: 1,668 findings, all of them,
    # every one a `unified_sites` uuid, none in APPLY.sql, ROLLBACK.sql, CHUNK.json or the
    # refusals.
    '''output/remediation/import_hero/.*PLAN\.jsonl''',
    # WD2/IH, the import-hero lane's acceptance report
    # (output/remediation/import_hero/<run>/ACCEPTANCE.json): its per-site answers are keyed by the
    # site's `unified_sites` uuid, so the default generic-api-key rule reads the uuid itself as a
    # key with an entropy-looking value. Same finding as PLAN.jsonl, same public identifier - found
    # 2026-10-06 in run import-hero-2026-10-06-004, commit 2b6081fe, which blocked the SAST gate for
    # every push afterwards.
    '''output/remediation/import_hero/.*ACCEPTANCE\.json''',
]
