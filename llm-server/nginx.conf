# Nginx reverse proxy for Ollama + Reranker with API key auth
# API key is injected via OLLAMA_API_KEY environment variable

server {
    listen 8080;
    server_name _;

    # Increase timeouts for slow local inference
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;

    # Health check (no auth required)
    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # OpenAI-compatible API (Ollama)
    location /v1/ {
        # Validate Bearer token
        if ($http_authorization != "Bearer ${OLLAMA_API_KEY}") {
            return 401 '{"error": "unauthorized"}';
        }

        proxy_pass http://ollama:11434/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }

    # Ollama native API
    location /api/ {
        if ($http_authorization != "Bearer ${OLLAMA_API_KEY}") {
            return 401 '{"error": "unauthorized"}';
        }

        proxy_pass http://ollama:11434/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }

    # Reranker service
    location /rerank {
        if ($http_authorization != "Bearer ${OLLAMA_API_KEY}") {
            return 401 '{"error": "unauthorized"}';
        }

        proxy_pass http://reranker:8787/rerank;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Content-Type $content_type;
    }
}
