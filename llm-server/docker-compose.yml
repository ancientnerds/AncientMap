services:
  ollama:
    image: ollama/ollama:latest
    container_name: llm_ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
      - ./entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    environment:
      - OLLAMA_MODEL_HEAVY=${OLLAMA_MODEL_HEAVY:-qwen3.5:9b}
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    deploy:
      resources:
        limits:
          memory: 12G
    restart: unless-stopped

  reranker:
    build: ./reranker
    container_name: llm_reranker
    environment:
      - RERANKER_MODEL=${RERANKER_MODEL:-ms-marco-MiniLM-L-12-v2}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8787/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: llm_nginx
    ports:
      - "${NGINX_PORT:-8080}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
    environment:
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-change-me-to-random-secret}
    depends_on:
      reranker:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_models:
