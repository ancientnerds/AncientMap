name: Backfill Images

# Manual on-demand workflow that SSHes into the VPS and runs image backfills
# against existing published Theo papers. The live pipeline generates images
# during a run; this workflow is for papers that shipped without them.
#
# Trigger from the CLI:
#   gh workflow run backfill-images.yml -f slug=SLUG -f mode=probative
#   gh workflow run backfill-images.yml -f slug=SLUG -f mode=captions       # rewrite captions only, no API calls
#   gh workflow run backfill-images.yml -f slug=SLUG -f mode=reflow         # reflow images into paragraphs + dedup, no API calls
#   gh workflow run backfill-images.yml -f slug=SLUG -f mode=clean_titles   # strip .jpg/.png/upload-ids from alt + caption leads
#   gh workflow run backfill-images.yml -f slug=SLUG -f mode=hero           # pick best inline image as banner hero
#   gh workflow run backfill-images.yml -f slug=SLUG -f mode=source_urls    # percent-encode parens in [Source](url) so markdown doesn't break
#
# The workflow invokes the Docker API container so it inherits prod DB creds
# from the running environment — no secrets travel over the wire.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Paper slug to backfill (leave blank if using request_id)'
        required: false
        type: string
      request_id:
        description: 'Paper UUID to backfill (only clean_titles supports this; unpublished drafts)'
        required: false
        type: string
      mode:
        description: 'Which backfill to run'
        required: true
        type: choice
        default: probative
        options:
          - probative
          - captions
          - reflow
          - clean_titles
          - hero
          - source_urls

jobs:
  backfill:
    name: Run backfill on VPS
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Run backfill via SSH
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
              -p ${{ secrets.VPS_PORT }} \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              'set -e
              cd /var/www/ancientnerds
              SLUG="${{ github.event.inputs.slug }}"
              REQ_ID="${{ github.event.inputs.request_id }}"
              MODE="${{ github.event.inputs.mode }}"
              if [ -n "$REQ_ID" ]; then
                TARGET_LABEL="id=${REQ_ID}"
              else
                TARGET_LABEL="slug=${SLUG}"
              fi
              echo "==> Backfill ${MODE} images for ${TARGET_LABEL}"

              if [ "$MODE" = "probative" ]; then
                echo "==> Running probative backfill..."
                docker exec ancient_nerds_api \
                  python -m pipeline.lyra.backfill_probative_images --slug "${SLUG}" --apply
              fi

              if [ "$MODE" = "captions" ]; then
                echo "==> Rewriting captions on stored images (no API calls)..."
                docker exec ancient_nerds_api \
                  python -m pipeline.lyra.rewrite_image_captions --slug "${SLUG}" --apply
              fi

              if [ "$MODE" = "reflow" ]; then
                echo "==> Reflowing images into paragraph anchors + deduping (no API calls)..."
                docker exec ancient_nerds_api \
                  python -m pipeline.lyra.reflow_images --slug "${SLUG}" --apply
              fi

              if [ "$MODE" = "clean_titles" ]; then
                echo "==> Cleaning raw filenames out of inline image titles (no API calls)..."
                if [ -n "$REQ_ID" ]; then
                  docker exec ancient_nerds_api \
                    python -m pipeline.lyra.clean_image_titles --id "${REQ_ID}" --apply
                else
                  docker exec ancient_nerds_api \
                    python -m pipeline.lyra.clean_image_titles --slug "${SLUG}" --apply
                fi
              fi

              if [ "$MODE" = "hero" ]; then
                echo "==> Picking best inline probative image as banner hero (no API calls)..."
                docker exec ancient_nerds_api \
                  python -m pipeline.lyra.backfill_hero_image --slug "${SLUG}" --apply
              fi

              if [ "$MODE" = "source_urls" ]; then
                echo "==> Encoding parens in [Source](url) markdown (no API calls)..."
                docker exec ancient_nerds_api \
                  python -m pipeline.lyra.fix_source_urls --slug "${SLUG}" --apply
              fi

              echo "==> Done."
              '
