name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # Manual trigger — added 2026-08-06 during the GitHub Actions outage:
  # dispatch runs are created via the API and bypass stalled push-event
  # processing. Also handy as a general re-run button.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      deps: ${{ steps.filter.outputs.deps }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'ancient-nerds-map/**'
            backend:
              - 'api/**'
              - 'pipeline/**'
            deps:
              - 'requirements*.txt'
              - 'ancient-nerds-map/package.json'
              - 'ancient-nerds-map/package-lock.json'
            docker:
              - 'Dockerfile*'
              - 'docker-compose.yml'

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: ancient-nerds-map
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ancient-nerds-map/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Dead files & unused dependencies (knip)
        run: npx knip --no-progress --include files,dependencies,devDependencies

      - name: Build
        run: npm run build

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy import-linter==2.13 vulture==2.16

      - name: Lint with ruff
        run: ruff check api/ pipeline/

      - name: Check formatting with ruff
        run: ruff format --check api/ pipeline/

      - name: Architecture contracts (import-linter)
        run: lint-imports

      - name: Dead code scan (vulture)
        run: vulture api/ pipeline/ .vulture_whitelist.py --min-confidence 80

      - name: Verify shared data is up to date
        run: python pipeline/generate_shared_data.py --verify

      - name: Type check with mypy
        run: mypy api/ --no-error-summary

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.deps == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Scan Python dependencies
        run: |
          pip-audit -r requirements.txt
          pip-audit -r requirements-api.txt --ignore-vuln CVE-2026-25990  # Pillow CVE — blocked by fastembed<12 pin
          pip-audit -r requirements.lyra.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan npm dependencies
        working-directory: ancient-nerds-map
        continue-on-error: true  # Pre-existing workbox/serialize-javascript chain — can't fix until vite-plugin-pwa updates
        run: npm audit --audit-level=critical

  tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.deps == 'true'
    # Deploy-blocking since 2026-08-07 (run 31149638773 proved green on a
    # clean runner: 872 passed in ~30s). --timeout converts environment-
    # dependent hangs (e.g. the MiniMax limiter's real-time pacing against
    # mocked clients) into visible failures instead of silent 90s stalls.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt -r requirements.lyra.txt \
            pytest pytest-asyncio pytest-mock pytest-timeout

      - name: Run unit tests (DB-less subset)
        env:
          # LYRA_-prefixed names are what pipeline config actually reads
          # (first CI execution 2026-08-06 failed on the un-prefixed ones).
          LYRA_ANTHROPIC_API_KEY: ci-dummy
          LYRA_MINIMAX_API_KEY: ci-dummy
          MINIMAX_API_KEY: ci-dummy
          ANTHROPIC_API_KEY: ci-dummy
          # Low-priority crawl pacing (>=60s/LLM-call) is the DEFAULT — it
          # paced the mocked dispatch tests straight into the 90s timeout.
          LYRA_THEO_LOW_PRIORITY: "0"
        run: python -m pytest -q -m "not integration and not live_llm and not slow" --timeout 90 --tb=short

  sast:
    name: SAST & Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans the full commit history

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install semgrep
        run: pip install semgrep==1.172.0

      - name: Semgrep (CODE_AUDIT.md mechanical patterns)
        run: semgrep scan --config .semgrep --metrics=off --error api/ pipeline/ ancient-nerds-map/src/

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Gitleaks (secrets, full history)
        run: gitleaks git . --no-banner --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore

      - name: LLM prompt injection guards (CODE_AUDIT.md LLM01)
        run: |
          missing=0
          for f in pipeline/lyra/prompts/*.txt; do
            grep -q "IMPORTANT:" "$f" || { echo "MISSING injection guard: $f"; missing=1; }
          done
          exit $missing

  container-scan:
    name: Container Scan
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.docker == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install trivy
        run: curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.73.0

      - name: Trivy config scan (Dockerfiles + compose)
        run: |
          mkdir -p /tmp/dockerscan
          cp Dockerfile* docker-compose.yml /tmp/dockerscan/
          trivy config /tmp/dockerscan --severity HIGH,CRITICAL --exit-code 1

      - name: Build API image
        run: docker build -t ancientmap-api-scan .

      - name: Trivy image scan (blocks on fixable HIGH/CRITICAL)
        run: trivy image ancientmap-api-scan --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [changes, lint-frontend, lint-backend, security-scan, sast, container-scan, tests]
    # Explicit per-job result checks instead of bare !failure(): during the
    # 2026-08-06 GitHub runner outage a deploy started although sast and
    # changes had FAILED at "Set up job" — !failure() did not stop it.
    # changes + sast must SUCCEED (they always run); the path-filtered jobs
    # may legitimately be skipped but must not have failed.
    if: |
      always() &&
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.sast.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.lint-frontend.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.lint-backend.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.security-scan.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.container-scan.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.tests.result) &&
      github.ref == 'refs/heads/main' &&
      contains(fromJSON('["push", "workflow_dispatch"]'), github.event_name)
    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy via SSH
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'set -e
            cd /var/www/ancientnerds
            BEFORE=$(git rev-parse HEAD)
            echo "==> Preserving snapshots..."
            cp -r public/data/snapshots /tmp/snapshots_backup 2>/dev/null || true
            echo "==> Freeing disk space..."
            docker image prune -f 2>/dev/null || true
            docker builder prune -af 2>/dev/null || true
            git lfs prune 2>/dev/null || true
            echo "==> Discarding local changes..."
            git checkout -- .
            git clean -fd ancient-nerds-map/public/data/ public/data/ 2>/dev/null || true
            echo "==> Pulling latest..."
            git -c core.logAllRefUpdates=false pull origin main || {
              echo "    Pull failed, trying permission fix..."
              find .git/logs -not -writable -delete 2>/dev/null || true
              git pull origin main
            }
            git lfs pull
            echo "==> Fixing wiki image permissions for API container..."
            chmod -R a+w public/data/images/wiki/ 2>/dev/null || true
            echo "==> Restoring snapshots..."
            mkdir -p public/data/snapshots
            cp -r /tmp/snapshots_backup/* public/data/snapshots/ 2>/dev/null || true
            rm -rf /tmp/snapshots_backup
            AFTER=$(git rev-parse HEAD)
            CHANGED=$(git diff --name-only $BEFORE $AFTER)

            echo "==> Applying pending SQL migrations..."
            docker exec -i ancient_nerds_db psql -U ancient_map -d ancient_map -c \
              "CREATE TABLE IF NOT EXISTS applied_migrations (filename TEXT PRIMARY KEY, applied_at TIMESTAMP DEFAULT NOW());"
            for f in migrations/*.sql; do
              [ -f "$f" ] || continue
              fname=$(basename "$f")
              already=$(docker exec -i ancient_nerds_db psql -U ancient_map -d ancient_map -tAc \
                "SELECT COUNT(*) FROM applied_migrations WHERE filename = '"'"'$fname'"'"'";)
              if [ "$already" = "0" ]; then
                echo "    Applying: $fname"
                docker cp "$f" ancient_nerds_db:/tmp/"$fname"
                # lock_timeout: an ALTER queued behind a long transaction
                # blocked the whole lock queue for 4+ min on 2026-08-06
                # (leaked idle-in-transaction session) until the SSH pipe
                # died. Fail fast + loud instead; the DB additionally kills
                # idle-in-transaction sessions after 15min (ALTER SYSTEM).
                docker exec -i -e PGOPTIONS="-c lock_timeout=20s -c statement_timeout=600s" ancient_nerds_db psql -U ancient_map -d ancient_map -v ON_ERROR_STOP=1 -f /tmp/"$fname"
                docker exec -i ancient_nerds_db psql -U ancient_map -d ancient_map -c \
                  "INSERT INTO applied_migrations (filename) VALUES ('"'"'$fname'"'"');"
              fi
            done
            echo "==> Migrations done."

            # Update nginx config if changed
            if echo "$CHANGED" | grep -q "^ancientnerds-nginx-config"; then
              echo "==> Updating nginx config..."
              sudo /bin/cp /var/www/ancientnerds/ancientnerds-nginx-config /etc/nginx/sites-available/ancientnerds.com
              if sudo /usr/sbin/nginx -t; then
                sudo /bin/systemctl reload nginx
                echo "    Nginx reloaded"
              else
                echo "ERROR: nginx config test failed! Restoring previous config."
                exit 1
              fi
            fi

            # Static data assets (layers, historical, basemaps, sea-levels, labels.json)
            # are now git-tracked in public/data/ — no copy step needed.
            # nginx serves /data/ directly from public/data/.

            # Rebuild frontend if files changed, dist is missing, or dist was built from a different commit
            DIST_COMMIT=$(cat ancient-nerds-map/dist/.built-commit 2>/dev/null || echo "unknown")
            if echo "$CHANGED" | grep -q "^ancient-nerds-map/" || [ ! -f ancient-nerds-map/dist/an-logo.svg ] || [ "$DIST_COMMIT" != "$AFTER" ]; then
              echo "==> Building frontend..."
              # Clean stale node_modules if root-owned
              rm -rf "ancient-nerds-map/node_modules" 2>/dev/null || {
                echo "    node_modules has stale permissions, moving aside..."
                mv "ancient-nerds-map/node_modules" "ancient-nerds-map/node_modules-bak-$(date +%s)" 2>/dev/null || true
              }
              rm -rf ancient-nerds-map/node_modules-bak-* 2>/dev/null || true
              # Build to temp dir so dist/ stays live until build succeeds
              rm -rf ancient-nerds-map/dist-new
              (cd ancient-nerds-map && npm ci && npm run build -- --outDir dist-new)
              if [ ! -f ancient-nerds-map/dist-new/index.html ] || [ ! -f ancient-nerds-map/dist-new/an-logo.svg ]; then
                echo "ERROR: Frontend build failed — dist-new/index.html or an-logo.svg missing!"
                rm -rf ancient-nerds-map/dist-new
                exit 1
              fi
              # Atomic swap using timestamp so dist-old never conflicts
              # (stale dist-old from root-owned build would block mv dist dist-old)
              SWAP_TS=$(date +%s)
              rm -rf ancient-nerds-map/dist/dist-new 2>/dev/null || true
              mv ancient-nerds-map/dist "ancient-nerds-map/dist-old-$SWAP_TS" 2>/dev/null || true
              mv ancient-nerds-map/dist-new ancient-nerds-map/dist
              find ancient-nerds-map -maxdepth 1 -name 'dist-old*' -exec rm -rf {} + 2>/dev/null || true
              echo "$AFTER" > ancient-nerds-map/dist/.built-commit
              echo "    Frontend built and swapped successfully (commit: $AFTER)"
            else
              echo "==> Frontend unchanged, skipping build"
            fi

            # Detect which Docker services need rebuilding
            REBUILD=""
            if echo "$CHANGED" | grep -qE "^(api/|pipeline/|Dockerfile$|requirements\.txt|requirements-api)"; then
              REBUILD="$REBUILD api"
            fi
            if echo "$CHANGED" | grep -qE "^(pipeline/|Dockerfile\.lyra|requirements\.lyra)"; then
              REBUILD="$REBUILD lyra"
            fi
            if echo "$CHANGED" | grep -qE "^(scripts/webcam_stream_proxy|Dockerfile\.webcam-proxy)"; then
              REBUILD="$REBUILD webcam-proxy"
            fi

            # Drift guard (2026-08-07): $CHANGED only covers THIS pull. When a
            # deploy dies after `git pull` (that night: SSH pipe broke during a
            # blocked migration), the next run sees an empty diff and silently
            # skips the rebuild — prod then serves old code from a repo that
            # already has the new commit. Compare the RUNNING container commit
            # against HEAD and force a rebuild on mismatch.
            RUNNING_COMMIT=$(curl -sf --max-time 5 http://localhost:8000/ | sed -n "s/.*\"commit\":\"\([^\"]*\)\".*/\1/p")
            HEAD_SHORT=$(git rev-parse --short=8 HEAD)
            if [ "$RUNNING_COMMIT" != "$HEAD_SHORT" ]; then
              echo "==> Container drift: running=${RUNNING_COMMIT:-none} head=$HEAD_SHORT — forcing api+lyra rebuild"
              case "$REBUILD" in *api*) ;; *) REBUILD="$REBUILD api";; esac
              case "$REBUILD" in *lyra*) ;; *) REBUILD="$REBUILD lyra";; esac
            fi

            # The research worker shares the api image but NOT its lifecycle:
            # a paper takes 7-15h and a rebuild kills it (twice on 2026-08-07,
            # ~9% of the weekly token budget each). Rebuild it only when it is
            # idle; a busy worker keeps the old image until the next deploy
            # after its run finishes. Fail-safe: if the check itself fails we
            # assume BUSY and skip — a stale worker beats a murdered run.
            THEO_BUSY=$(docker exec ancient_nerds_db psql -U ancient_map -d ancient_map -tAc \
              "SELECT COUNT(*) FROM research_requests WHERE status = 'running';" 2>/dev/null || echo "unknown")
            THEO_EXISTS=$(docker ps -a --filter name=ancient_nerds_theo_worker --format '{{.Names}}')
            if [ -z "$THEO_EXISTS" ]; then
              # First deploy after the split (or someone removed it): the API no
              # longer runs a worker, so skipping here would stop Theo entirely.
              echo "==> Theo worker container missing — creating it regardless of run state"
              case "$REBUILD" in *theo-worker*) ;; *) REBUILD="$REBUILD theo-worker";; esac
            elif [ "$THEO_BUSY" = "0" ]; then
              case "$REBUILD" in *theo-worker*) ;; *) REBUILD="$REBUILD theo-worker";; esac
            else
              echo "==> Theo worker busy (running=$THEO_BUSY) — leaving it on the old image"
            fi

            if [ -n "$REBUILD" ]; then
              echo "==> Rebuilding:$REBUILD"
              docker compose rm -sf $REBUILD 2>/dev/null || true
              BUILD_HASH=$(git rev-parse --short HEAD) docker compose up -d --build --remove-orphans $REBUILD
            elif echo "$CHANGED" | grep -qE "^docker-compose\.yml"; then
              echo "==> Compose config changed, recreating services..."
              BUILD_HASH=$(git rev-parse --short HEAD) docker compose up -d --remove-orphans
            else
              echo "==> No Docker changes, ensuring services are running..."
              docker compose up -d --remove-orphans
            fi
            if [ -n "$REBUILD" ]; then
              echo "==> Waiting for API health..."
              for i in $(seq 1 24); do
                sleep 5
                if curl -sf http://localhost:8000/; then
                  echo " API healthy after $((i * 5))s"
                  break
                fi
                if [ "$i" = "24" ]; then
                  echo "ERROR: Health check failed after 120s!"
                  docker compose logs api --tail=30
                  exit 1
                fi
                echo " Attempt $i failed, retrying..."
              done
            else
              echo "==> API unchanged, skipping health check"
            fi

            echo "==> Generating static sitemap..."
            if curl -sf --max-time 30 http://localhost:8000/api/sitemap/sitemap.xml > ancient-nerds-map/dist/sitemap.xml; then
              echo "    Sitemap written to dist/sitemap.xml"
            else
              echo "    WARNING: Sitemap generation failed (non-fatal)"
            fi

            echo "==> Refreshing library data..."
            REFRESH_KEY=$(grep "^LIBRARY_REFRESH_KEY=" .env | cut -d= -f2- | tr -d "\r")
            if curl -sf --max-time 120 -X POST -H "X-Internal-Key: $REFRESH_KEY" http://localhost:8000/api/library/refresh > /dev/null; then
              echo "    Library refreshed"
            else
              echo "    WARNING: Library refresh failed (non-fatal)"
            fi

            echo "==> Restarting log streaming..."
            [ -f scripts/follow_logs.sh ] && chmod +x scripts/follow_logs.sh
            mkdir -p logs
            if [ -f logs/.follow_logs.pid ]; then
              kill "$(cat logs/.follow_logs.pid)" 2>/dev/null || true
              sleep 1
            fi
            if [ -f scripts/follow_logs.sh ]; then
              nohup ./scripts/follow_logs.sh </dev/null >/dev/null 2>&1 &
              echo $! > logs/.follow_logs.pid
              disown
            fi
            echo "==> Deploy complete!"
            exit 0'

  daily-release:
    name: Daily Release Tag
    runs-on: ubuntu-latest
    needs: [deploy]
    if: needs.deploy.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-tag daily patch release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)

          # Get latest semver tag (e.g. v1.1.0)
          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$LATEST" ]; then
            # No tags yet — seed from package.json version
            PKG_VERSION=$(node -p "require('./ancient-nerds-map/package.json').version")
            NEW_TAG="v${PKG_VERSION}"
            echo "No existing tags, creating initial tag $NEW_TAG"
          else
            # Use tag creation date (not commit date) to correctly handle same-day multi-push
            TAG_DATE=$(git for-each-ref --format='%(creatordate:short)' "refs/tags/$LATEST")
            if [ "$TAG_DATE" = "$TODAY" ]; then
              echo "Already tagged today ($LATEST), skipping"
              exit 0
            fi

            # Bump patch: v1.1.0 → v1.1.1
            MAJOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f1)
            MINOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f2)
            PATCH=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f3)
            NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          echo "Tagging $NEW_TAG"
          # Annotated tags need an identity; the runner has none by default
          # (observed 2026-07-26: "fatal: empty ident name").
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "$NEW_TAG"
          git push origin "$NEW_TAG"
          gh release create "$NEW_TAG" --title "$NEW_TAG" --generate-notes --latest
