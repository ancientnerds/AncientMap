name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'ancient-nerds-map/**'
            backend:
              - 'api/**'
              - 'pipeline/**'
            deps:
              - 'requirements*.txt'
              - 'ancient-nerds-map/package.json'
              - 'ancient-nerds-map/package-lock.json'

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: ancient-nerds-map
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ancient-nerds-map/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Lint with ruff
        run: ruff check api/ pipeline/

      - name: Check formatting with ruff
        run: ruff format --check api/ pipeline/

      - name: Verify shared data is up to date
        run: python pipeline/generate_shared_data.py --verify

      - name: Type check with mypy
        run: mypy api/ --no-error-summary

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.deps == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Scan Python dependencies
        run: |
          pip-audit -r requirements.txt
          pip-audit -r requirements-api.txt --ignore-vuln CVE-2026-25990  # Pillow CVE — blocked by fastembed<12 pin
          pip-audit -r requirements.lyra.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan npm dependencies
        working-directory: ancient-nerds-map
        continue-on-error: true  # Pre-existing workbox/serialize-javascript chain — can't fix until vite-plugin-pwa updates
        run: npm audit --audit-level=critical

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [changes, lint-frontend, lint-backend, security-scan]
    if: |
      always() &&
      !failure() &&
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy via SSH
        run: |
          ssh -o StrictHostKeyChecking=accept-new -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'set -e
            cd /var/www/ancientnerds
            BEFORE=$(git rev-parse HEAD)
            echo "==> Preserving snapshots..."
            cp -r public/data/snapshots /tmp/snapshots_backup 2>/dev/null || true
            echo "==> Freeing disk space..."
            docker image prune -f 2>/dev/null || true
            docker builder prune -af 2>/dev/null || true
            git lfs prune 2>/dev/null || true
            echo "==> Discarding local changes..."
            git checkout -- .
            git clean -fd ancient-nerds-map/public/data/ public/data/ 2>/dev/null || true
            echo "==> Pulling latest..."
            git -c core.logAllRefUpdates=false pull origin main || {
              echo "    Pull failed, trying permission fix..."
              find .git/logs -not -writable -delete 2>/dev/null || true
              git pull origin main
            }
            git lfs pull
            echo "==> Fixing wiki image permissions for API container..."
            chmod -R a+w public/data/images/wiki/ 2>/dev/null || true
            echo "==> Restoring snapshots..."
            mkdir -p public/data/snapshots
            cp -r /tmp/snapshots_backup/* public/data/snapshots/ 2>/dev/null || true
            rm -rf /tmp/snapshots_backup
            AFTER=$(git rev-parse HEAD)
            CHANGED=$(git diff --name-only $BEFORE $AFTER)

            echo "==> Applying pending SQL migrations..."
            docker exec -i ancient_nerds_db psql -U ancient_map -d ancient_map -c \
              "CREATE TABLE IF NOT EXISTS applied_migrations (filename TEXT PRIMARY KEY, applied_at TIMESTAMP DEFAULT NOW());"
            for f in migrations/*.sql; do
              [ -f "$f" ] || continue
              fname=$(basename "$f")
              already=$(docker exec -i ancient_nerds_db psql -U ancient_map -d ancient_map -tAc \
                "SELECT COUNT(*) FROM applied_migrations WHERE filename = '"'"'$fname'"'"'";)
              if [ "$already" = "0" ]; then
                echo "    Applying: $fname"
                docker cp "$f" ancient_nerds_db:/tmp/"$fname"
                docker exec -i ancient_nerds_db psql -U ancient_map -d ancient_map -f /tmp/"$fname"
                docker exec -i ancient_nerds_db psql -U ancient_map -d ancient_map -c \
                  "INSERT INTO applied_migrations (filename) VALUES ('"'"'$fname'"'"');"
              fi
            done
            echo "==> Migrations done."

            # One-shot hero scripts
            if [ -f scripts/set_hero_gobekli.sh ]; then
              echo "==> Running hero script..."
              bash scripts/set_hero_gobekli.sh
              rm -f scripts/set_hero_gobekli.sh
              git add -A scripts/set_hero_gobekli.sh 2>/dev/null || true
              echo "    Hero script done."
            fi

            # Update nginx config if changed
            if echo "$CHANGED" | grep -q "^ancientnerds-nginx-config"; then
              echo "==> Updating nginx config..."
              sudo /bin/cp /var/www/ancientnerds/ancientnerds-nginx-config /etc/nginx/sites-available/ancientnerds.com
              if sudo /usr/sbin/nginx -t; then
                sudo /bin/systemctl reload nginx
                echo "    Nginx reloaded"
              else
                echo "ERROR: nginx config test failed! Restoring previous config."
                exit 1
              fi
            fi

            # Static data assets (layers, historical, basemaps, sea-levels, labels.json)
            # are now git-tracked in public/data/ — no copy step needed.
            # nginx serves /data/ directly from public/data/.

            # Rebuild frontend if files changed, dist is missing, or dist was built from a different commit
            DIST_COMMIT=$(cat ancient-nerds-map/dist/.built-commit 2>/dev/null || echo "unknown")
            if echo "$CHANGED" | grep -q "^ancient-nerds-map/" || [ ! -f ancient-nerds-map/dist/an-logo.svg ] || [ "$DIST_COMMIT" != "$AFTER" ]; then
              echo "==> Building frontend..."
              # Clean stale node_modules if root-owned
              rm -rf "ancient-nerds-map/node_modules" 2>/dev/null || {
                echo "    node_modules has stale permissions, moving aside..."
                mv "ancient-nerds-map/node_modules" "ancient-nerds-map/node_modules-bak-$(date +%s)" 2>/dev/null || true
              }
              rm -rf ancient-nerds-map/node_modules-bak-* 2>/dev/null || true
              # Build to temp dir so dist/ stays live until build succeeds
              rm -rf ancient-nerds-map/dist-new
              (cd ancient-nerds-map && npm ci && npm run build -- --outDir dist-new)
              if [ ! -f ancient-nerds-map/dist-new/index.html ] || [ ! -f ancient-nerds-map/dist-new/an-logo.svg ]; then
                echo "ERROR: Frontend build failed — dist-new/index.html or an-logo.svg missing!"
                rm -rf ancient-nerds-map/dist-new
                exit 1
              fi
              # Atomic swap using timestamp so dist-old never conflicts
              # (stale dist-old from root-owned build would block mv dist dist-old)
              SWAP_TS=$(date +%s)
              rm -rf ancient-nerds-map/dist/dist-new 2>/dev/null || true
              mv ancient-nerds-map/dist "ancient-nerds-map/dist-old-$SWAP_TS" 2>/dev/null || true
              mv ancient-nerds-map/dist-new ancient-nerds-map/dist
              find ancient-nerds-map -maxdepth 1 -name 'dist-old*' -exec rm -rf {} + 2>/dev/null || true
              echo "$AFTER" > ancient-nerds-map/dist/.built-commit
              echo "    Frontend built and swapped successfully (commit: $AFTER)"
            else
              echo "==> Frontend unchanged, skipping build"
            fi

            # Detect which Docker services need rebuilding
            REBUILD=""
            if echo "$CHANGED" | grep -qE "^(api/|pipeline/|Dockerfile$|requirements\.txt|requirements-api)"; then
              REBUILD="$REBUILD api"
            fi
            if echo "$CHANGED" | grep -qE "^(pipeline/|Dockerfile\.lyra|requirements\.lyra)"; then
              REBUILD="$REBUILD lyra"
            fi
            if echo "$CHANGED" | grep -qE "^(scripts/webcam_stream_proxy|Dockerfile\.webcam-proxy)"; then
              REBUILD="$REBUILD webcam-proxy"
            fi

            if [ -n "$REBUILD" ]; then
              echo "==> Rebuilding:$REBUILD"
              docker compose rm -sf $REBUILD 2>/dev/null || true
              BUILD_HASH=$(git rev-parse --short HEAD) docker compose up -d --build --remove-orphans $REBUILD
            elif echo "$CHANGED" | grep -qE "^docker-compose\.yml"; then
              echo "==> Compose config changed, recreating services..."
              BUILD_HASH=$(git rev-parse --short HEAD) docker compose up -d --remove-orphans
            else
              echo "==> No Docker changes, ensuring services are running..."
              docker compose up -d --remove-orphans
            fi
            echo "==> Waiting for API health..."
            for i in $(seq 1 24); do
              sleep 5
              if curl -sf http://localhost:8000/; then
                echo " API healthy after $((i * 5))s"
                break
              fi
              if [ "$i" = "24" ]; then
                echo "ERROR: Health check failed after 120s!"
                docker compose logs api --tail=30
                exit 1
              fi
              echo " Attempt $i failed, retrying..."
            done

            echo "==> Generating static sitemap..."
            if curl -sf --max-time 30 http://localhost:8000/api/sitemap/sitemap.xml > ancient-nerds-map/dist/sitemap.xml; then
              echo "    Sitemap written to dist/sitemap.xml"
            else
              echo "    WARNING: Sitemap generation failed (non-fatal)"
            fi

            echo "==> Restarting log streaming..."
            [ -f scripts/follow_logs.sh ] && chmod +x scripts/follow_logs.sh
            mkdir -p logs
            if [ -f logs/.follow_logs.pid ]; then
              kill "$(cat logs/.follow_logs.pid)" 2>/dev/null || true
              sleep 1
            fi
            if [ -f scripts/follow_logs.sh ]; then
              nohup ./scripts/follow_logs.sh </dev/null >/dev/null 2>&1 &
              echo $! > logs/.follow_logs.pid
              disown
            fi
            echo "==> Deploy complete!"
            exit 0'

  daily-release:
    name: Daily Release Tag
    runs-on: ubuntu-latest
    needs: [deploy]
    if: needs.deploy.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-tag daily patch release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)

          # Get latest semver tag (e.g. v1.1.0)
          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$LATEST" ]; then
            # No tags yet — seed from package.json version
            PKG_VERSION=$(node -p "require('./ancient-nerds-map/package.json').version")
            NEW_TAG="v${PKG_VERSION}"
            echo "No existing tags, creating initial tag $NEW_TAG"
          else
            # Use tag creation date (not commit date) to correctly handle same-day multi-push
            TAG_DATE=$(git for-each-ref --format='%(creatordate:short)' "refs/tags/$LATEST")
            if [ "$TAG_DATE" = "$TODAY" ]; then
              echo "Already tagged today ($LATEST), skipping"
              exit 0
            fi

            # Bump patch: v1.1.0 → v1.1.1
            MAJOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f1)
            MINOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f2)
            PATCH=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f3)
            NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          echo "Tagging $NEW_TAG"
          git tag -a "$NEW_TAG" -m "$NEW_TAG"
          git push origin "$NEW_TAG"
          gh release create "$NEW_TAG" --title "$NEW_TAG" --generate-notes --latest
