<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Founders · Ancient Nerds</title>
    <meta name="robots" content="noindex, nofollow" />

    <!-- The AN mark in the dashboard's green. Not /favicon.svg: on the stats host
         every path outside the dashboard's own goes to Umami, which answers the
         site's icons with HTML. Vite emits it under /assets/, which the stats host serves. -->
    <link rel="icon" type="image/svg+xml" href="/src/components/dashboard/an-logo-green.svg" />
    <meta name="theme-color" content="#060604" />
    <!-- Self-hosted fonts, served by the stats host from the same dist. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/jetbrains-mono-400-latin.woff2" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <noscript>
      <p style="padding: 40px 20px; background: #060604; color: #e8e8e0; font-family: sans-serif;">
        This dashboard needs JavaScript. <a href="/websites/" style="color: #ff2a2a;">Open Umami</a>
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/dashboardMain.tsx"></script>
  </body>
</html>
